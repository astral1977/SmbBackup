name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Samba-Testserver starten (SMB2/SMB3 wie Synology DSM 6)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends samba
          sudo useradd -M -s /usr/sbin/nologin backupuser
          sudo mkdir -p /srv/smbtest && sudo chown backupuser /srv/smbtest
          sudo tee /etc/samba/smb.conf > /dev/null <<'CONF'
          [global]
            server role = standalone server
            server min protocol = SMB2_02
            server max protocol = SMB3
            disable netbios = yes
            load printers = no
          [backup]
            path = /srv/smbtest
            read only = no
            valid users = backupuser
          CONF
          printf 'geheim123\ngeheim123\n' | sudo smbpasswd -s -a backupuser
          sudo systemctl restart smbd

      - name: Tests (inkl. SMB-Integrationstest)
        env:
          SMBBACKUP_TEST_HOST: 127.0.0.1
          SMBBACKUP_TEST_SHARE: backup
          SMBBACKUP_TEST_USER: backupuser
          SMBBACKUP_TEST_PASSWORD: geheim123
        run: ./gradlew :core:test --stacktrace

      - name: Signaturschlüssel aus GitHub-Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SMBBACKUP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SMBBACKUP_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Eigener Signaturschlüssel aus den Secrets wird verwendet."
          else
            echo "::warning::Secret SMBBACKUP_KEYSTORE_BASE64 fehlt – APK wird mit dem Entwicklungsschlüssel aus dem Repository signiert."
          fi

      - name: APK bauen
        env:
          SMBBACKUP_KEYSTORE_PASSWORD: ${{ secrets.SMBBACKUP_KEYSTORE_PASSWORD }}
          SMBBACKUP_KEY_ALIAS: ${{ secrets.SMBBACKUP_KEY_ALIAS }}
          SMBBACKUP_KEY_PASSWORD: ${{ secrets.SMBBACKUP_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Signatur anzeigen
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "DN|SHA-256"

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk SmbBackup-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmbBackup-apk-${{ github.run_number }}
          path: SmbBackup-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: core/build/reports/tests/
